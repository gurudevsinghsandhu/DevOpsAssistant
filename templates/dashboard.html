<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevOps AI Dashboard</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      font-family: "Segoe UI", sans-serif;
      background: url('/static/images/galaxy-bg.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 20, 0.7);
      backdrop-filter: blur(5px);
      z-index: 0;
    }

    .sidebar {
      width: 300px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(6px);
      border-right: 1px solid rgba(255, 255, 255, 0.2);
      padding: 20px;
      z-index: 2;
      overflow-y: auto;
    }

    .sidebar h2 {
      color: #00eaff;
      font-size: 22px;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(0, 234, 255, 0.6);
    }

    .chat-item {
      margin-bottom: 12px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .chat-item:hover {
      background: rgba(0, 234, 255, 0.2);
      transform: scale(1.03);
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 30px;
      z-index: 1;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .top-bar h1 {
      font-size: 26px;
      color: #00eaff;
      text-shadow: 0 0 12px rgba(0, 234, 255, 0.6);
    }

    .top-bar a {
      text-decoration: none;
      color: #fff;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid rgba(0, 234, 255, 0.6);
      transition: all 0.3s ease;
    }

    .top-bar a:hover {
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      box-shadow: 0 0 15px rgba(0, 234, 255, 0.7);
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 120px);
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      margin-bottom: 0;
      display: flex;
      flex-direction: column;
    }

    .message {
      margin-bottom: 12px;
      padding: 10px;
      border-radius: 8px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .user {
      background: rgba(0, 234, 255, 0.2);
      align-self: flex-end;
    }

    .ai {
      background: rgba(255, 255, 255, 0.2);
      align-self: flex-start;
    }

    #chat-form {
      position: sticky;
      bottom: 0;
      background: rgba(0, 0, 0, 0.0);
      backdrop-filter: blur(6px);
      padding: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.0);
    }

    textarea {
      width: 98.5%;
      height: 100px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 16px;
      resize: none;
    }

    button {
      margin-top: 15px;
      padding: 12px;
      width: 100%;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 12px rgba(0, 234, 255, 0.4);
    }

    button:hover {
      transform: scale(1.03);
      box-shadow: 0 0 18px rgba(0, 234, 255, 0.6);
    }
  </style>
</head>
<body>

  <div class="sidebar" id="sidebar">
    <h2>Chat History</h2>
    {% if history %}
      {% for chat in history %}
        <div class="chat-item" data-id="{{ chat.id }}">{{ chat.query[:40] }}...</div>
      {% endfor %}
    {% else %}
      <p>No previous chats.</p>
    {% endif %}
  </div>

  <div class="main">
    <div class="top-bar">
      <h1>Welcome, {{ username }}</h1>
      <a href="/logout">Logout</a>
    </div>

    <div class="chat-area">
      <div class="chat-box" id="chat-box">
        {% if chats %}
          {% for msg in chats %}
            <div class="message {{ msg.role }}">{{ msg.content }}</div>
          {% endfor %}
        {% endif %}
      </div>

      <form id="chat-form">
        <textarea name="query" id="query" placeholder="Describe your app or ask DevOps AI..."></textarea>
        <button type="submit">Send</button>
      </form>
    </div>
  </div>
  
  <script>
    const form = document.getElementById('chat-form');
    const chatBox = document.getElementById('chat-box');
    const textarea = document.getElementById('query');
    const sidebar = document.getElementById('sidebar');
    const userId = {{ user_id }};

    // ✅ Fetch updated chat history
    async function loadChatHistory() {
      try {
        const res = await fetch(`/chat-history/${userId}`);
        const data = await res.json();

        sidebar.innerHTML = "<h2>Chat History</h2>";

        if (!Array.isArray(data) || data.length === 0) {
          sidebar.innerHTML += "<p>No previous chats.</p>";
          return;
        }

        data.forEach(chat => {
          const item = document.createElement('div');
          item.className = 'chat-item';
          item.textContent = chat.query.slice(0, 40) + '...';
          item.onclick = () => loadChat(chat);
          sidebar.appendChild(item);
        });
      } catch (err) {
        console.error("Error loading chat history:", err);
        sidebar.innerHTML += "<p>Error loading chats.</p>";
      }
    }

    // ✅ Load selected chat into main chat box
    function loadChat(chat) {
      chatBox.innerHTML = '';

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.textContent = chat.query;

      const aiMsg = document.createElement('div');
      aiMsg.className = 'message ai';
      aiMsg.textContent = chat.response;

      chatBox.appendChild(userMsg);
      chatBox.appendChild(aiMsg);
    }

    // ✅ Handle sending new messages
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = textarea.value.trim();
      if (!query) return;

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.textContent = query;
      chatBox.appendChild(userMsg);
      chatBox.scrollTop = chatBox.scrollHeight;

      textarea.value = '';

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });

        const data = await res.json();

        const aiMsg = document.createElement('div');
        aiMsg.className = 'message ai';
        aiMsg.textContent = data.response || 'No response received.';
        chatBox.appendChild(aiMsg);
        chatBox.scrollTop = chatBox.scrollHeight;

        // ✅ Refresh sidebar
        await loadChatHistory();
      } catch (err) {
        console.error(err);
      }
    });

    // ✅ Allow Enter to send (Shift+Enter = newline)
    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    // ✅ Initial load
    window.addEventListener('DOMContentLoaded', loadChatHistory);
  </script>
</body>
</html>
