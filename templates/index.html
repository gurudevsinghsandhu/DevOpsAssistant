<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevOps AI Resource Estimator</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", sans-serif;
      background: url('/static/images/galaxy-bg.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 20, 0.6);
      backdrop-filter: blur(4px);
      z-index: 0;
    }
    .box {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 16px;
      padding: 40px;
      width: 90%;
      max-width: 700px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
      animation: fadeIn 1.5s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      font-size: 30px;
      color: #00eaff;
      text-shadow: 0 0 12px rgba(0, 234, 255, 0.6);
      margin-bottom: 20px;
    }
    textarea {
      width: 100%;
      height: 130px;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 16px;
      resize: none;
    }
    textarea:focus {
      outline: none;
      border-color: #00eaff;
      box-shadow: 0 0 10px #00eaff;
    }
    button {
      margin-top: 20px;
      padding: 14px;
      width: 100%;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0, 234, 255, 0.4);
      transition: all 0.3s ease;
    }
    button:hover {
      transform: scale(1.03);
      box-shadow: 0 0 18px rgba(0, 234, 255, 0.6);
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>DevOps AI Resource Estimator</h1>
    <form method="POST" action="/estimate">
      <textarea name="app_description" placeholder="e.g. A Django app with 10k users and PostgreSQL DB..."></textarea>
      <button type="submit">Estimate Resources</button>
    </form>
  </div>
</body>
</html>
