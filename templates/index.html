<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps AI Resource Estimator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-image: url("/static/hawa-mahal.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    .backdrop {
      background-color: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center">

  <div class="backdrop shadow-2xl rounded-2xl p-10 w-full max-w-xl text-center">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">🚀 DevOps AI Resource Estimator</h1>
    <p class="text-gray-700 mb-8">Describe your application below, and our AI will recommend the best cloud setup for you.</p>

    <form action="/estimate" method="post" class="flex flex-col gap-5">
      <textarea
        name="user_input"
        rows="4"
        placeholder="e.g. A Laravel e-commerce site with 10k daily users"
        class="border border-gray-300 rounded-lg p-4 focus:outline-none focus:ring-2 focus:ring-purple-500"
        required
      ></textarea>

      <button
        type="submit"
        class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3 rounded-lg text-lg font-semibold hover:opacity-90 transition"
      >
        Estimate Resources
      </button>
    </form>
  </div>

</body>
</html>
