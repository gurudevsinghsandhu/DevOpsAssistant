<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevOps AI Resource Estimator</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", sans-serif;
      background: url('/static/images/galaxy-bg.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      overflow: hidden;
      position: relative;
      flex-direction: column;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 20, 0.6);
      backdrop-filter: blur(4px);
      z-index: 0;
    }

    /* Header Buttons */
    .top-buttons {
      position: absolute;
      top: 20px;
      right: 30px;
      display: flex;
      gap: 15px;
      z-index: 2;
    }

    .top-buttons a {
      text-decoration: none;
      color: white;
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid rgba(0, 234, 255, 0.6);
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      box-shadow: 0 0 10px rgba(0, 234, 255, 0.4);
      transition: all 0.3s ease;
      font-weight: 500;
      letter-spacing: 0.5px;
      font-size: 15px;
    }

    .top-buttons a:hover {
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      transform: scale(1.05);
      box-shadow: 0 0 18px rgba(0, 234, 255, 0.8);
    }

    /* Main Box */
    .box {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 18px;
      padding: 40px 50px;
      width: 90%;
      max-width: 600px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
      animation: fadeIn 1.5s ease forwards;
      margin-bottom: 60px; /* space for footer */
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 28px;
      color: #00eaff;
      text-shadow: 0 0 12px rgba(0, 234, 255, 0.6);
      margin-bottom: 25px;
    }

    /* Textarea Section */
    .textarea-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    textarea {
      width: 100%;
      height: 130px;
      padding: 15px 60px 15px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 16px;
      resize: none;
      line-height: 1.6;
    }

    textarea:focus {
      outline: none;
      border-color: #00eaff;
      box-shadow: 0 0 10px #00eaff;
    }

    /* Floating Button */
    .send-btn {
      position: absolute;
      bottom: 18px;
      right: 18px;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      color: white;
      border: none;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px rgba(0, 234, 255, 0.4);
      transition: all 0.3s ease;
    }

    .send-btn:hover {
      transform: scale(1.15);
      box-shadow: 0 0 24px rgba(0, 234, 255, 0.8);
    }

    /* Footer */
    footer {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: #cfefff;
      z-index: 2;
      text-shadow: 0 0 6px rgba(0, 234, 255, 0.4);
      letter-spacing: 0.3px;
      background: rgba(0, 0, 0, 0.2);
      padding: 8px 0;
      border-top: 1px solid rgba(0, 234, 255, 0.2);
      backdrop-filter: blur(3px);
    }
 

    @media (max-width: 600px) {
      .box {
        padding: 25px 30px;
        max-width: 90%;
      }
      h1 {
        font-size: 22px;
      }
      textarea {
        height: 110px;
      }
      .send-btn {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }
      footer {
        font-size: 12px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Buttons -->
  <div class="top-buttons">
    <a href="/signin">Sign In</a>
    <a href="/signup">Sign Up</a>
  </div>

  <!-- Main Box -->
  <div class="box">
    <h1>Cloud Resource Estimator</h1>
    <form method="POST" action="/estimate">
      <div class="textarea-wrapper">
        <textarea name="app_description" placeholder="Ask anything"></textarea>
        <button type="submit" class="send-btn" title="Estimate Resources">↑</button>
      </div>
    </form>
  </div>

  <!-- Footer -->
  <footer>
    Copyright © 2025 Cloud Resources Assistance by 
    <strong>Gurudev Singh</strong> and <strong>Akshat Mehra</strong> - All Rights Reserved
  </footer>

</body>
</html>
